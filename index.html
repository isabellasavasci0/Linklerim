<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün Linkleri</title>
<style>
:root{--bg:#faf7f5;--fg:#1d1b1a;--kart:#fff;--cizgi:#e7e1dd;--vurgu:#b4456a}
@media (prefers-color-scheme:dark){:root{--bg:#161413;--fg:#f1ecea;--kart:#201d1c;--cizgi:#34302e;--vurgu:#e58aa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0 0 4px} .alt{color:#8a817d;margin:0 0 20px;font-size:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--vurgu);margin:26px 0 10px}
.kart{display:flex;gap:12px;align-items:center;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
padding:14px;margin-bottom:10px;color:inherit;text-decoration:none}
.kart:active{transform:scale(.99)}
.no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--vurgu);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.ad{flex:1;min-width:0} .fiyat{flex:none;font-weight:600}
footer{margin-top:28px;font-size:12px;color:#8a817d}
</style></head><body><main>
<h1>Ürün Linkleri</h1>
<p class="alt">Numaralar gönderideki görsellerin sırasıyla aynı.</p>
<p>Henüz ürün yok.</p>
<footer>Bir Amazon Ortağı olarak, nitelikli satışlardan kazanç sağlıyorum. Fiyatlar paylaşım anındaki fiyatlardır, değişebilir.</footer>
</main></body></html>
